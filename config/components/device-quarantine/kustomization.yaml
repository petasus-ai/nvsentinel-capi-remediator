# Device quarantine's role and its binding to the manager's ServiceAccount.
# Add this component to an overlay of config/default together with the
# --device-quarantine and --quarantine-drivers arguments; see
# docs/device-quarantine.md. role.yaml is generated by make manifests.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- role.yaml
- role_binding.yaml
# The component is added outside the name prefix and labels config/default
# applies, so the role is given them here. The binding refers to the role by
# its generated name, which kustomize rewrites to this one.
patches:
- target:
    kind: ClusterRole
    name: device-quarantine-role
  patch: |
    - op: replace
      path: /metadata/name
      value: nvsentinel-capi-remediator-device-quarantine-role
    - op: add
      path: /metadata/labels
      value:
        app.kubernetes.io/name: nvsentinel-capi-remediator
