---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: device-quarantine-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - machines
  verbs:
  - delete
- apiGroups:
  - infrastructure.cluster.x-k8s.io
  resources:
  - kubevirtclusters
  - kubevirtmachines
  verbs:
  - get
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachineinstances
  verbs:
  - get
- apiGroups:
  - resource.k8s.io
  resources:
  - devicetaintrules
  verbs:
  - create
  - get
  - list
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  verbs:
  - get
