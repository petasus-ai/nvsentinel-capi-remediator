# The component is added outside the name prefix and labels config/default
# applies, so the binding carries them itself. Its references are still
# rewritten to the prefixed names.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvsentinel-capi-remediator-device-quarantine-rolebinding
  labels:
    app.kubernetes.io/name: nvsentinel-capi-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: device-quarantine-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
