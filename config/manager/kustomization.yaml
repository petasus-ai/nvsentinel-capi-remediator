apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- manager.yaml
# The image manager.yaml calls "controller". The default is the image the
# release workflow will publish; make deploy and make build-installer set
# it to IMG instead.
images:
- name: controller
  newName: ghcr.io/petasus-ai/nvsentinel-capi-remediator
  newTag: latest
