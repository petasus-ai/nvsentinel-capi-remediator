name: verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Pushes to main get a group per
# commit so a run is never cancelled or skipped while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pins CI to the minimum toolchain the module declares, so the
          # go.mod requirement is what gets tested.
          go-version-file: go.mod

      - name: Verify
        run: make verify
