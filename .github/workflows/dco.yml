name: dco

# Every commit of a pull request must be signed off by its author under the
# Developer Certificate of Origin. See CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history, so that both ends of the pull request are there.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The commits are those of the branch that are not on its base, so a
      # base that has moved on since the branch was cut does not matter.
      - name: Check the sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: hack/verify-dco.sh "$BASE" "$HEAD"
