version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows current, including the
  # version comments next to each pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Moves the digest pins of the base images in the Dockerfile. The golang
  # tag follows the go directive in go.mod and is moved with it by hand, so
  # only its digest is updated here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*golang"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Cluster API is moved by hand, and with it the k8s.io modules and
    # controller-runtime to the minor versions that Cluster API release builds
    # with: they are released against each other, so a minor or major bump of
    # one does not build on its own. Patch releases are independent and still
    # come here.
    ignore:
      - dependency-name: "k8s.io/*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: sigs.k8s.io/controller-runtime
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "sigs.k8s.io/cluster-api*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
