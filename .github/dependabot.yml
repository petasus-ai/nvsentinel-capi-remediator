version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows current, including the
  # version comments next to each pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Moves the digest pins of the base images in the Dockerfile. The golang
  # tag follows the go directive in go.mod and is moved with it by hand, so
  # only its digest is updated here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*golang"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # The k8s.io modules, controller-runtime and Cluster API are released
      # against each other, so a minor or major bump of one of them does not
      # build on its own; they are proposed as one update. Patch releases
      # are independent and stay separate.
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/controller-runtime
          - sigs.k8s.io/cluster-api*
        update-types:
          - minor
          - major
